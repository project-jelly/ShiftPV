apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftpvpools.shiftpv.io
  labels:
    shiftpv.io/uninstall-protected: "true"
spec:
  group: shiftpv.io
  scope: Cluster
  names:
    plural: shiftpvpools
    singular: shiftpvpool
    kind: ShiftPVPool
    shortNames: [sp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.nodeName
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: LastProbe
          type: date
          jsonPath: .status.lastProbeTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: '!has(oldSelf.status) || !has(oldSelf.status.registrationApproved) || !oldSelf.status.registrationApproved || (has(self.status) && has(self.status.registrationApproved) && self.status.registrationApproved)'
              message: registration approval cannot be removed
            - rule: '!has(oldSelf.status) || !has(oldSelf.status.capacityUnit) || (has(self.status) && has(self.status.capacityUnit) && self.status.capacityUnit == oldSelf.status.capacityUnit)'
              message: recorded capacityUnit cannot be changed or removed
          properties:
            spec:
              type: object
              required: [nodeName, mountPath, capacity]
              x-kubernetes-validations:
                - rule: '!has(oldSelf.capacityPolicy) || (has(self.capacityPolicy) && self.capacityPolicy == oldSelf.capacityPolicy)'
                  message: capacityPolicy cannot be removed or changed once set
                - rule: has(self.mountPolicy) == has(oldSelf.mountPolicy)
                  message: mountPolicy cannot be added or removed after Pool creation
                - rule: has(self.poolGroup) == has(oldSelf.poolGroup)
                  message: poolGroup cannot be added or removed after Pool creation
              properties:
                nodeName:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: nodeName is immutable
                poolGroup:
                  description: StorageClass selection group; omitted means default.
                  type: string
                  minLength: 1
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: poolGroup is immutable
                mountPath:
                  type: string
                  minLength: 2
                  pattern: ^/
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: mountPath is immutable
                    - rule: self != '/'
                      message: mountPath must not be the filesystem root
                mountPolicy:
                  description: RequireMountPoint opts into a mounted filesystem identity guard. Omitted preserves ordinary directory Pools.
                  type: string
                  enum: [RequireMountPoint]
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: mountPolicy is immutable
                capacityPolicy:
                  description: FixedBlock opts into fixed block allocation evidence. It can be enabled on an existing Pool and is required for multiple Pools on one node.
                  type: string
                  enum: [FixedBlock]
                capacity:
                  type: object
                  required: [limit]
                  properties:
                    limit:
                      type: string
                      minLength: 1
                scanEpoch:
                  description: Monotonic causal inventory request. Incrementing it advances metadata.generation and requires a new complete node observation.
                  type: integer
                  format: int64
                  minimum: 0
            status:
              type: object
              properties:
                registrationApproved:
                  description: Successful registration history; retained when later probes fail.
                  type: boolean
                observedGeneration:
                  type: integer
                  format: int64
                lastProbeTime:
                  type: string
                  format: date-time
                filesystemTotalBytes:
                  type: integer
                  format: int64
                  minimum: 0
                capacityProbeSupported:
                  type: boolean
                capacityProbe:
                  description: Answer to one live capacity request, bound to a unique request ID and exact Pool evidence. Ordinary cached capacity cannot approve allocation.
                  type: object
                  required: [requestID, evidence, totalBytes, availableBytes, availableInodes, observedAt]
                  properties:
                    requestID: {type: string, pattern: '^[0-9a-f]{32}$'}
                    evidence: {type: string, pattern: '^[0-9a-f]{64}$'}
                    totalBytes: {type: integer, format: int64, minimum: 0}
                    availableBytes: {type: integer, format: int64, minimum: 0}
                    availableInodes: {type: integer, format: int64, minimum: 0}
                    error: {type: string, maxLength: 1024}
                    observedAt: {type: string, format: date-time}
                capacityUnit:
                  type: object
                  required: [device, source, filesystem, extents]
                  properties:
                    device: {type: string, minLength: 3, maxLength: 32}
                    source: {type: string, minLength: 1, maxLength: 4096}
                    filesystem:
                      type: string
                      enum: [ext4, xfs]
                    extents:
                      type: array
                      minItems: 1
                      maxItems: 256
                      items:
                        type: object
                        required: [device, start, sectors]
                        properties:
                          device: {type: string, minLength: 3, maxLength: 69}
                          start: {type: integer, format: int64, minimum: 0}
                          sectors: {type: integer, format: int64, minimum: 1}
                mountIdentity:
                  type: object
                  required: [device, root, source, filesystem]
                  properties:
                    device: {type: string}
                    root: {type: string}
                    source: {type: string}
                    filesystem: {type: string}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                      message:
                        type: string
                inventory:
                  type: object
                  required: [observedAt, valid]
                  properties:
                    observedAt:
                      type: string
                      format: date-time
                    valid:
                      type: boolean
                    truncated:
                      type: boolean
                    message:
                      type: string
                    copies:
                      type: array
                      maxItems: 256
                      items:
                        type: object
                        required: [marker, present]
                        properties:
                          marker:
                            type: string
                          present:
                            type: boolean
                          published:
                            type: boolean
                          problem:
                            type: string
                          identity:
                            type: object
                            required: [installationID, poolName, poolUID, volumeID, volumeUID, copyID, nodeName, role]
                            properties:
                              installationID: {type: string}
                              poolName: {type: string}
                              poolUID: {type: string}
                              volumeID: {type: string}
                              volumeUID: {type: string}
                              copyID: {type: string}
                              nodeName: {type: string}
                              role:
                                type: string
                                enum: [Serving, Incoming, Retired]
      subresources:
        status: {}
