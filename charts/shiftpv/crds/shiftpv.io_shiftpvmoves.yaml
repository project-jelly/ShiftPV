apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shiftpvmoves.shiftpv.io
  labels:
    shiftpv.io/uninstall-protected: "true"
spec:
  group: shiftpv.io
  scope: Cluster
  names:
    plural: shiftpvmoves
    singular: shiftpvmove
    kind: ShiftPVMove
    shortNames: [sm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Reason
          type: string
          jsonPath: .status.reason
        - name: Source
          type: string
          jsonPath: .spec.sourceNode
        - name: Recovery
          type: string
          jsonPath: .status.recoveryPhase
        - name: Destination
          type: string
          jsonPath: .status.destinationNode
        - name: LastProgress
          type: date
          jsonPath: .status.lastProgressTime
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: '!has(self.spec.recovery) || (has(self.status) && has(self.status.phase) && self.status.phase == "Blocked")'
              message: recovery may only be requested on a Blocked move
            - rule: '!has(self.status) || !has(self.status.preparation) || self.status.preparation == null || (has(self.spec.protocolVersion) && self.spec.protocolVersion == "prepared-v1")'
              message: preparation requires the prepared-v1 protocol
          properties:
            spec:
              type: object
              required: [volumeID, sourceNode]
              x-kubernetes-validations:
                - rule: "oldSelf.hasValue() || (has(self.protocolVersion) && self.protocolVersion == 'prepared-v1')"
                  optionalOldSelf: true
                  message: new Moves require prepared-v1
                - rule: '!has(oldSelf.recovery) || (has(self.recovery) && self.recovery == oldSelf.recovery)'
                  message: recovery cannot be removed or changed once requested
                - rule: 'has(self.protocolVersion) == has(oldSelf.protocolVersion) && (!has(self.protocolVersion) || self.protocolVersion == oldSelf.protocolVersion)'
                  message: protocolVersion presence and value are immutable
              properties:
                protocolVersion:
                  type: string
                  enum: [prepared-v1]
                volumeID:
                  type: string
                  pattern: ^shiftpv-[a-f0-9]{32}$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: volumeID is immutable
                sourceNode:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: sourceNode is immutable
                recovery:
                  type: string
                  enum: [ResumeOwner]
            status:
              type: object
              x-kubernetes-validations:
                - rule: '!has(self.preparation) || self.preparation == null || ((!has(self.capacityApproved) || !self.capacityApproved) && !has(self.incomingCopy) && !has(self.destinationCopy) && (!has(self.copyOperationID) || self.copyOperationID == "") && (!has(self.promotionOperationID) || self.promotionOperationID == "") && (!has(self.copyJobName) || self.copyJobName == "") && (!has(self.promotionJobName) || self.promotionJobName == "") && !has(self.cleanup) && !has(self.rollbackRequiredGeneration))'
                  message: preparation cannot coexist with destination execution authority
                - rule: '!has(self.preparation) || self.preparation == null || (has(self.sourceCopy) && has(self.persistentVolumeName) && self.persistentVolumeName != "" && has(self.persistentVolumeUID) && has(self.persistentVolumeClaimNamespace) && self.persistentVolumeClaimNamespace != "" && has(self.persistentVolumeClaimName) && self.persistentVolumeClaimName != "" && has(self.persistentVolumeClaimUID) && has(self.consumerName) && self.consumerName != "" && has(self.consumerUID) && self.consumerUID != "" && has(self.placementPodUID))'
                  message: preparation requires the exact source copy, binding, consumer and placement identities
              properties:
                preparation:
                  type: object
                  nullable: true
                  required: [pool, nodeName, reservedBytes]
                  properties:
                    pool:
                      type: object
                      required: [name, uid]
                      properties:
                        name: {type: string, minLength: 1}
                        uid: {type: string, minLength: 1}
                    nodeName: {type: string, minLength: 1}
                    reservedBytes:
                      type: integer
                      format: int64
                      minimum: 1
                persistentVolumeUID: {type: string, minLength: 1}
                persistentVolumeClaimUID: {type: string, minLength: 1}
                placementPodUID: {type: string, minLength: 1}
                phase:
                  type: string
                  enum: [Pending, Preparing, StartingDisruption, Canceling, Cancelled, Locking, Evicting, WaitingForUnpublish, WaitingForReplacement, WaitingForDestination, WaitingForCapacity, Copying, Promoting, Committing, ReleasingDestination, WaitingForDestinationPublish, CleaningSource, Completing, Blocked, Succeeded]
                recoveryPhase:
                  type: string
                  enum: ['', Quiescing, Verifying, Retiring, Resuming, Completing, Recovered]
                rollbackRequiredGeneration:
                  description: Pool generation requested after Retiring; required before rollback inventory can release capacity.
                  type: integer
                  format: int64
                  minimum: 1
                recoveryOwner:
                  type: string
                recoveryReason:
                  type: string
                recoveryMessage:
                  type: string
                reason:
                  type: string
                message:
                  type: string
                lastTransitionTime:
                  type: string
                  format: date-time
                lastProgressTime:
                  type: string
                  format: date-time
                persistentVolumeName:
                  type: string
                persistentVolumeClaimNamespace:
                  type: string
                persistentVolumeClaimName:
                  type: string
                destinationNode:
                  type: string
                destinationPoolUID:
                  type: string
                sourceBytes:
                  type: integer
                  format: int64
                  minimum: 0
                capacityApproved:
                  type: boolean
                capacityReason:
                  type: string
                consumerName:
                  type: string
                consumerUID:
                  type: string
                replacementName:
                  type: string
                replacementUID:
                  type: string
                evictionRequested:
                  type: boolean
                copyJobName:
                  type: string
                promotionJobName:
                  type: string
                copyOperationID:
                  type: string
                promotionOperationID:
                  type: string
                sourceCopy: &copyIdentity
                  type: object
                  required: [installationID, poolName, poolUID, volumeID, volumeUID, copyID, nodeName, role]
                  properties:
                    installationID: {type: string}
                    poolName: {type: string}
                    poolUID: {type: string}
                    volumeID: {type: string}
                    volumeUID: {type: string}
                    copyID: {type: string}
                    nodeName: {type: string}
                    role:
                      type: string
                      enum: [Serving, Incoming, Retired]
                incomingCopy: *copyIdentity
                destinationCopy: *copyIdentity
                candidateNodes:
                  type: array
                  items:
                    type: string
                  x-kubernetes-list-type: set
                cleanup:
                  type: object
                  required: [spec, status]
                  properties:
                    spec:
                      type: object
                      required: [operationID, target, reason, authority]
                      properties:
                        operationID:
                          type: string
                          minLength: 1
                        target: *copyIdentity
                        reason:
                          type: string
                          enum: [MoveSource, MoveRollback]
                        authority:
                          type: object
                          required: [kind, name, uid]
                          properties:
                            kind:
                              type: string
                              enum: [ShiftPVMove]
                            name:
                              type: string
                              minLength: 1
                            uid:
                              type: string
                              minLength: 1
                    status:
                      type: object
                      required: [phase]
                      properties:
                        phase:
                          type: string
                          enum: [Pending, Running, Verifying, ConfirmingAbsence, Completed, NeedsReview]
                        observedGeneration:
                          type: integer
                          format: int64
                        reason:
                          type: string
                        message:
                          type: string
                        lastTransitionTime:
                          type: string
                          format: date-time
                        executor:
                          type: object
                          required: [nodeName]
                          x-kubernetes-validations:
                            - rule: "!has(self.kind) ? (has(self.jobName) && has(self.jobUID)) : (has(self.namespace) && has(self.podName) && has(self.podUID) && !has(self.jobName) && !has(self.jobUID))"
                              message: "executor must bind either a legacy Job or a resident Node Pod"
                          properties:
                            kind:
                              type: string
                              enum: [Node]
                            namespace:
                              type: string
                            podName:
                              type: string
                            jobName:
                              type: string
                              minLength: 1
                            jobUID:
                              type: string
                              minLength: 1
                            podUID:
                              type: string
                            nodeName:
                              type: string
                              minLength: 1
                        receipt:
                          type: object
                          required: [operationID, executorUID, observedAt, retired, purged, localReceiptDigest]
                          properties:
                            operationID:
                              type: string
                              minLength: 1
                            executorUID:
                              type: string
                              minLength: 1
                            observedAt:
                              type: string
                              format: date-time
                            retired:
                              type: boolean
                            purged:
                              type: boolean
                            localReceiptDigest:
                              type: string
                              pattern: '^[0-9a-f]{64}$'
                        absenceProof:
                          type: object
                          required: [requestID, poolName, poolUID, requiredGeneration]
                          properties:
                            requestID:
                              type: string
                              minLength: 1
                            poolName:
                              type: string
                              minLength: 1
                            poolUID:
                              type: string
                              minLength: 1
                            requiredGeneration:
                              type: integer
                              format: int64
                              minimum: 1
                            observedGeneration:
                              type: integer
                              format: int64
                            valid:
                              type: boolean
                            complete:
                              type: boolean
                            absent:
                              type: boolean
                            confirmedAt:
                              type: string
                              format: date-time
                        settledAt:
                          type: string
                          format: date-time
      subresources:
        status: {}
