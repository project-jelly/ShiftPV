imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

metrics:
  enabled: false
  port: 8080
  snapshotInterval: 30s
  dashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
  prometheusRule:
    enabled: false
    additionalLabels: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 5s
    additionalLabels: {}

controller:
  replicas: 1
  logLevel: 2
  image:
    repository: ghcr.io/project-jelly/shiftpv-controller
    tag: 0.4.11
    pullPolicy: IfNotPresent
  resources: {}

mobility:
  enabled: true
  interval: 30s
  # Settled terminal Move journals are metadata-only audit records. They are
  # deleted after this retention; copy data and unresolved journals are never
  # deleted by this policy.
  journalRetention: 168h
  webhookPort: 9443
  # Empty inherits controller.image, including an optional digest pin.
  helperImage: ""

node:
  # This must match the kubelet state root on every selected node.
  # MicroK8s uses /var/snap/microk8s/common/var/lib/kubelet by default.
  kubeletRootDir: /var/lib/kubelet
  logLevel: 2
  image:
    repository: ghcr.io/project-jelly/shiftpv-node
    tag: 0.4.7
    pullPolicy: IfNotPresent
  nodeSelector: {}
  tolerations: []
  resources: {}

helperPod:
  # Empty inherits controller.image, including an optional digest pin.
  image: ""
  timeout: 2m
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

poolReadiness:
  # staleAfter must exceed interval with allowance for Kubernetes API delays.
  interval: 1m
  staleAfter: 3m

lifecycle:
  # Use argocd when Argo CD owns this release so a blocked Application deletion
  # stays pending and completes automatically after storage dependencies are removed.
  uninstallMode: helm

storageClass:
  create: true
  name: shiftpv
  # Opt in explicitly; installing ShiftPV must not change where unrelated PVCs land.
  defaultClass: false
  reclaimPolicy: Delete

retainStorageClass:
  create: true
  name: shiftpv-retain
  defaultClass: false
  reclaimPolicy: Retain

serviceAccount:
  controller:
    create: true
    name: ""
  helper:
    create: true
    name: ""
  node:
    create: true
    name: ""

sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
    resources: {}
  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
    resources: {}
  livenessProbe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.19.0
    resources: {}
