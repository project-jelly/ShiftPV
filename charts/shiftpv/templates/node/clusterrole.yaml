apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shiftpv.fullname" . }}-node
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
  - apiGroups: ["shiftpv.io"]
    resources: ["shiftpvpools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["shiftpv.io"]
    resources: ["shiftpvpools/status"]
    verbs: ["update"]
  - apiGroups: ["shiftpv.io"]
    resources: ["shiftpvvolumes"]
    verbs: ["get"]
  - apiGroups: ["shiftpv.io"]
    resources: ["shiftpvvolumes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csidrivers"]
    verbs: ["get"]
