apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shiftpv.fullname" . }}-node-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "shiftpv.fullname" . }}-node-executor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "shiftpv.nodeServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "shiftpv.fullname" . }}-node-executor
