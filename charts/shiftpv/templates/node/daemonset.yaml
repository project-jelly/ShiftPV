apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "shiftpv.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.componentLabels" (dict "root" . "component" "node") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "shiftpv.selectorLabels" (dict "root" . "component" "node") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "shiftpv.selectorLabels" (dict "root" . "component" "node") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shiftpv.nodeServiceAccount" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: shiftpv-node
          image: "{{ .Values.node.image.repository }}:{{ .Values.node.image.tag }}"
          imagePullPolicy: {{ .Values.node.image.pullPolicy }}
          command: ["/shiftpv-node"]
          args:
            - --endpoint=unix:///csi/csi.sock
            - --node-name=$(NODE_NAME)
            - --host-root=/host
            - --target-root={{ .Values.node.kubeletRootDir }}/pods
            - --pool-readiness-interval={{ .Values.poolReadiness.interval }}
            {{- if .Values.metrics.enabled }}
            - --metrics-listen-address=:{{ .Values.metrics.port }}
            {{- end }}
            - --v={{ .Values.node.logLevel }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: kubelet-pods
              mountPath: {{ .Values.node.kubeletRootDir }}/pods
              mountPropagation: Bidirectional
            - name: host-root
              mountPath: /host
              mountPropagation: HostToContainer
          {{- with .Values.node.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: node-driver-registrar
          image: {{ .Values.sidecars.registrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.node.kubeletRootDir }}/plugins/csi.shiftpv.io/csi.sock
            - --v={{ .Values.node.logLevel }}
          securityContext:
            {{- include "shiftpv.containerSecurityContext" (dict "runAsUser" 0) | nindent 12 }}
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          {{- with .Values.sidecars.registrar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- include "shiftpv.livenessProbeContainer" (dict
          "root" .
          "logLevel" .Values.node.logLevel
          "socketVolume" "plugin-dir"
          "socketDir" "/csi"
          "runAsUser" 0) | nindent 8 }}
      volumes:
        - name: plugin-dir
          hostPath:
            path: {{ .Values.node.kubeletRootDir }}/plugins/csi.shiftpv.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletRootDir }}/plugins_registry
            type: Directory
        - name: kubelet-pods
          hostPath:
            path: {{ .Values.node.kubeletRootDir }}/pods
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
