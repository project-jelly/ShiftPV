{{- if ne (int .Values.controller.replicas) 1 -}}
{{- fail "controller.replicas must be 1 because lifecycle and capacity admission share a single-writer fence" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shiftpv.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.componentLabels" (dict "root" . "component" "controller") | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "shiftpv.selectorLabels" (dict "root" . "component" "controller") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shiftpv.selectorLabels" (dict "root" . "component" "controller") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shiftpv.controllerServiceAccount" . }}
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: shiftpv-controller
          image: "{{ include "shiftpv.controllerImage" . }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: ["/shiftpv-controller"]
          args:
            - --endpoint=unix:///run/csi/csi.sock
            - --namespace=$(POD_NAMESPACE)
            - --helper-image={{ include "shiftpv.helperPodImage" . }}
            - --helper-timeout={{ .Values.helperPod.timeout }}
            - --helper-service-account={{ include "shiftpv.helperServiceAccount" . }}
            - --helper-cpu-request={{ .Values.helperPod.resources.requests.cpu }}
            - --helper-memory-request={{ .Values.helperPod.resources.requests.memory }}
            - --helper-cpu-limit={{ .Values.helperPod.resources.limits.cpu }}
            - --helper-memory-limit={{ .Values.helperPod.resources.limits.memory }}
            - --pool-readiness-stale-after={{ .Values.poolReadiness.staleAfter }}
            {{- if .Values.metrics.enabled }}
            - --metrics-listen-address=:{{ .Values.metrics.port }}
            - --metrics-snapshot-interval={{ .Values.metrics.snapshotInterval }}
            {{- end }}
            - --mobility-enabled={{ .Values.mobility.enabled }}
            - --webhook-service-name={{ include "shiftpv.webhookServiceName" . }}
            - --webhook-tls-secret-name={{ include "shiftpv.webhookSecretName" . }}
            - --webhook-configuration-name={{ include "shiftpv.webhookConfigurationName" . }}
            - --validation-webhook-configuration-name={{ include "shiftpv.validationWebhookConfigurationName" . }}
            - --controller-service-account={{ include "shiftpv.controllerServiceAccount" . }}
            - --storage-class-name={{ .Values.storageClass.name }}
            - --storage-class-name={{ .Values.retainStorageClass.name }}
            {{- range .Values.additionalStorageClasses }}
            {{- if .create }}
            - --storage-class-name={{ .name }}
            {{- end }}
            {{- end }}
            - --uninstall-permit-name={{ include "shiftpv.uninstallPermitName" . }}
            - --webhook-listen-address=:{{ .Values.mobility.webhookPort }}
            {{- if .Values.mobility.enabled }}
            - --mobility-interval={{ .Values.mobility.interval }}
            - --move-journal-retention={{ .Values.mobility.journalRetention }}
            - --mobility-helper-image={{ include "shiftpv.mobilityHelperImage" . }}
            {{- end }}
            - --v={{ .Values.controller.logLevel }}
          env:
            {{- include "shiftpv.podNamespaceEnv" . | nindent 12 }}
          securityContext:
            {{- include "shiftpv.containerSecurityContext" (dict "runAsNonRoot" true "runAsUser" 65532) | nindent 12 }}
          volumeMounts:
            - name: socket
              mountPath: /run/csi
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            - name: webhook
              containerPort: {{ .Values.mobility.webhookPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - --csi-address=/run/csi/csi.sock
            - --leader-election=true
            - --leader-election-namespace=$(POD_NAMESPACE)
            - --extra-create-metadata=true
            - --timeout=2m
            - --v={{ .Values.controller.logLevel }}
          env:
            {{- include "shiftpv.podNamespaceEnv" . | nindent 12 }}
          securityContext:
            {{- include "shiftpv.containerSecurityContext" (dict "runAsNonRoot" true "runAsUser" 65532) | nindent 12 }}
          volumeMounts:
            - name: socket
              mountPath: /run/csi
          {{- with .Values.sidecars.provisioner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- include "shiftpv.livenessProbeContainer" (dict
          "root" .
          "logLevel" .Values.controller.logLevel
          "socketVolume" "socket"
          "socketDir" "/run/csi"
          "runAsNonRoot" true
          "runAsUser" 65532) | nindent 8 }}
      volumes:
        - name: socket
          emptyDir: {}
