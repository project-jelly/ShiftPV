{{- $uninstallMode := lower .Values.lifecycle.uninstallMode -}}
{{- if not (has $uninstallMode (list "helm" "argocd")) -}}
{{- fail "lifecycle.uninstallMode must be either helm or argocd" -}}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shiftpv.uninstallGuardName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shiftpv.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: uninstall-guard
  annotations:
    {{- if eq $uninstallMode "argocd" }}
    "argocd.argoproj.io/hook": PreDelete
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
    {{- else }}
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- end }}
spec:
  backoffLimit: 0
  {{- if eq $uninstallMode "argocd" }}
  activeDeadlineSeconds: 86400
  {{- else }}
  activeDeadlineSeconds: 120
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "shiftpv.selectorLabels" (dict "root" . "component" "uninstall-guard") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "shiftpv.controllerServiceAccount" . }}
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: uninstall-guard
          image: "{{ include "shiftpv.controllerImage" . }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          command: ["/shiftpv-uninstall-guard"]
          args:
            - --storage-class={{ .Values.storageClass.name }}
            - --storage-class={{ .Values.retainStorageClass.name }}
            {{- range .Values.additionalStorageClasses }}
            {{- if .create }}
            - --storage-class={{ .name }}
            {{- end }}
            {{- end }}
            - --permit-namespace={{ .Release.Namespace }}
            - --permit-name={{ include "shiftpv.uninstallPermitName" . }}
            - --validation-webhook={{ include "shiftpv.validationWebhookConfigurationName" . }}
            - --pool-readiness-stale-after={{ .Values.poolReadiness.staleAfter }}
            - --timeout=90s
            {{- if eq $uninstallMode "argocd" }}
            - --retry
            - --retry-interval=5s
            {{- end }}
          securityContext:
            {{- include "shiftpv.containerSecurityContext" (dict "runAsNonRoot" true "runAsUser" 65532) | nindent 12 }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
