apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.shiftpv.io
  labels:
    {{- include "shiftpv.labels" . | nindent 4 }}
spec:
  attachRequired: false
  podInfoOnMount: false
  storageCapacity: {{ .Values.capacityTracking.enabled }}
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
