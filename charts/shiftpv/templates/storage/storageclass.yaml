{{- if and .Values.storageClass.create .Values.retainStorageClass.create (eq .Values.storageClass.name .Values.retainStorageClass.name) }}
{{- fail "storageClass.name and retainStorageClass.name must differ" }}
{{- end }}
{{- $names := dict }}
{{- range $class := concat (list .Values.storageClass .Values.retainStorageClass) .Values.additionalStorageClasses }}
{{- if $class.create }}
{{- if hasKey $names $class.name }}
{{- fail (printf "StorageClass name %q is duplicated" $class.name) }}
{{- end }}
{{- $_ := set $names $class.name true }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $class.name }}
  labels:
    {{- include "shiftpv.labels" $ | nindent 4 }}
  annotations:
    storageclass.kubernetes.io/is-default-class: {{ $class.defaultClass | quote }}
provisioner: csi.shiftpv.io
reclaimPolicy: {{ $class.reclaimPolicy }}
allowVolumeExpansion: false
volumeBindingMode: WaitForFirstConsumer
parameters:
  shiftpv.io/capacity-enforcement: none
  {{- if $class.poolGroup }}
  shiftpv.io/pool-group: {{ $class.poolGroup | quote }}
  {{- end }}
{{- end }}
{{- end }}
