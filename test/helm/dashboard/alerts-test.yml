rule_files:
  - /etc/shiftpv-alerts/shiftpv-rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",namespace="shiftpv-system",source="metadata"}'
        values: '0+0x6 1+0x5'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="shiftpv-system",source="metadata"}'
        values: '-600+0x6 420+60x5'
      - series: 'up{shiftpv="true",namespace="shiftpv-system",source="metadata"}'
        values: '1+0x11'
      - series: 'shiftpv_pool_accounting_valid{shiftpv="true",namespace="shiftpv-system",pool="pool-a",node="worker-a"}'
        values: '0+0x6 1+0x5'
      - series: 'shiftpv_pool_inventory_valid{shiftpv="true",namespace="shiftpv-system",pool="pool-a",node="worker-a"}'
        values: '0+0x6 1+0x5'
      - series: 'shiftpv_pool_inventory_truncated{shiftpv="true",namespace="shiftpv-system",pool="pool-b",node="worker-b"}'
        values: '1+0x6 0+0x5'
      - series: 'shiftpv_cleanup_requests{shiftpv="true",namespace="shiftpv-system",state="NeedsReview"}'
        values: '1+0x6 0+0x5'
      - series: 'shiftpv_copy_observations{shiftpv="true",namespace="shiftpv-system",pool="pool-a",state="OrphanPreserved"}'
        values: '1+0x6 0+0x5'
      - series: 'shiftpv_copy_observations{shiftpv="true",namespace="shiftpv-system",pool="pool-b",state="NeedsReview"}'
        values: '0+0x11'
    alert_rule_test:
      - eval_time: 6m
        alertname: ShiftPVObservationFailed
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, severity: critical, shiftpv: "true", source: metadata}
            exp_annotations:
              summary: "ShiftPV observation is failing"
              description: "The latest completed ShiftPV observation failed for five minutes (source=metadata, shiftpv_metrics_snapshot_success=0)."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvobservationfailed"
      - eval_time: 6m
        alertname: ShiftPVObservationStale
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, severity: critical, shiftpv: "true", source: metadata}
            exp_annotations:
              summary: "ShiftPV observation is stale"
              description: "A ShiftPV observation source is failing, stale, or missing from the current scrape targets (source=metadata)."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvobservationstale"
      - eval_time: 6m
        alertname: ShiftPVPoolAccountingInvalid
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, node: worker-a, pool: pool-a, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV Pool accounting is invalid"
              description: "Pool pool-a on node worker-a cannot use its capacity accounting state for admission decisions (shiftpv_pool_accounting_valid=0)."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvpoolaccountinginvalid"
      - eval_time: 6m
        alertname: ShiftPVPoolInventoryUnsafe
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, node: worker-a, pool: pool-a, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV Pool copy inventory is incomplete"
              description: "The inventory of Pool pool-a on node worker-a is invalid (shiftpv_pool_inventory_valid=0), so absence is not proven."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvpoolinventoryunsafe"
          - exp_labels: {namespace: shiftpv-system, node: worker-b, pool: pool-b, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV Pool copy inventory is incomplete"
              description: "The inventory of Pool pool-b on node worker-b exceeded its fixed scan bound (shiftpv_pool_inventory_truncated=1), so absence is not proven."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvpoolinventoryunsafe"
      - eval_time: 6m
        alertname: ShiftPVCleanupNeedsReview
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, severity: warning, shiftpv: "true", state: NeedsReview}
            exp_annotations:
              summary: "ShiftPV cleanup needs operator review"
              description: "1 durable cleanup contract(s) in state NeedsReview are preserving data pending operator action."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvcleanupneedsreview"
      - eval_time: 6m
        alertname: ShiftPVCopyNeedsReview
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, pool: pool-a, severity: warning, shiftpv: "true", state: OrphanPreserved}
            exp_annotations:
              summary: "ShiftPV copy placement needs review"
              description: "1 copy observation(s) in state OrphanPreserved on pool pool-a: the copy is orphan-preserved, missing from its expected placement, or carries an unsafe identity observation."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvcopyneedsreview"
      - eval_time: 8m
        alertname: ShiftPVObservationFailed
        exp_alerts: []
      - eval_time: 8m
        alertname: ShiftPVObservationStale
        exp_alerts: []
      - eval_time: 8m
        alertname: ShiftPVPoolAccountingInvalid
        exp_alerts: []
      - eval_time: 8m
        alertname: ShiftPVPoolInventoryUnsafe
        exp_alerts: []
      - eval_time: 8m
        alertname: ShiftPVCleanupNeedsReview
        exp_alerts: []
      - eval_time: 8m
        alertname: ShiftPVCopyNeedsReview
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shiftpv_volumes_without_persistent_volume{shiftpv="true",namespace="shiftpv-system",pool="retained"}'
        values: '1+0x361 0+0x4'
      - series: 'shiftpv_volumes_without_persistent_volume{shiftpv="true",namespace="shiftpv-system",pool="publishing"}'
        values: '1+0x2 0+0x363'
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",namespace="shiftpv-system",source="metadata"}'
        values: '1+0x365'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="shiftpv-system",source="metadata"}'
        values: '1+60x365'
    alert_rule_test:
      - eval_time: 5h59m
        alertname: ShiftPVVolumesWithoutPersistentVolume
        exp_alerts: []
      - eval_time: 6h1m
        alertname: ShiftPVVolumesWithoutPersistentVolume
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, pool: retained, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV retained owners have no PersistentVolume reference"
              description: "1 Ready or preserved Blocked Volume owner(s) on pool retained have no matching driver PersistentVolume. This may be delayed PV publication or retained data; inspect the Volume and provisioning history before deciding how to recover it. Data and capacity reservations remain protected."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/docs/spec/metrics.md#shiftpvvolumeswithoutpersistentvolume"
      - eval_time: 6h3m
        alertname: ShiftPVVolumesWithoutPersistentVolume
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shiftpv_volumes_without_persistent_volume{shiftpv="true",namespace="failed",pool="pool-a"}'
        values: '1+0x365'
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",namespace="failed",source="metadata"}'
        values: '0+0x365'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="failed",source="metadata"}'
        values: '1+60x365'
      - series: 'shiftpv_volumes_without_persistent_volume{shiftpv="true",namespace="stale",pool="pool-a"}'
        values: '1+0x365'
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",namespace="stale",source="metadata"}'
        values: '1+0x365'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="stale",source="metadata"}'
        values: '1+0x365'
      - series: 'shiftpv_volumes_without_persistent_volume{shiftpv="true",namespace="missing",pool="pool-a"}'
        values: '1+0x365'
    alert_rule_test:
      - eval_time: 6h1m
        alertname: ShiftPVVolumesWithoutPersistentVolume
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shiftpv_pool_filesystem_available_bytes{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",node="worker-a",pool="blocks"}'
        values: '0+0x6 4096+0x5'
      - series: 'shiftpv_pool_filesystem_available_inodes{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",node="worker-a",pool="blocks"}'
        values: '10+0x11'
      - series: 'shiftpv_pool_filesystem_available_bytes{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",node="worker-a",pool="inodes"}'
        values: '4096+0x11'
      - series: 'shiftpv_pool_filesystem_available_inodes{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",node="worker-a",pool="inodes"}'
        values: '0+0x6 10+0x5'
      - series: 'shiftpv_pool_filesystem_available_bytes{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",node="worker-a",pool="both"}'
        values: '0+0x6 4096+0x5'
      - series: 'shiftpv_pool_filesystem_available_inodes{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",node="worker-a",pool="both"}'
        values: '0+0x6 10+0x5'
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",source="filesystem"}'
        values: '1+0x11'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",job="shiftpv-custom",instance="node-a:8080",namespace="shiftpv-system",source="filesystem"}'
        values: '1+60x11'
    alert_rule_test:
      - eval_time: 4m
        alertname: ShiftPVPoolNoSpace
        exp_alerts: []
      - eval_time: 6m
        alertname: ShiftPVPoolNoSpace
        exp_alerts:
          - exp_labels: {job: shiftpv-custom, instance: "node-a:8080", namespace: shiftpv-system, node: worker-a, pool: blocks, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV Pool filesystem has no available space"
              description: "Pool blocks on node worker-a reports zero available bytes or inodes. New allocation is blocked and cleanup may need headroom for durable metadata. Preserve owned data and inspect the filesystem before reclaiming space."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/docs/spec/metrics.md#shiftpvpoolnospace"
          - exp_labels: {job: shiftpv-custom, instance: "node-a:8080", namespace: shiftpv-system, node: worker-a, pool: inodes, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV Pool filesystem has no available space"
              description: "Pool inodes on node worker-a reports zero available bytes or inodes. New allocation is blocked and cleanup may need headroom for durable metadata. Preserve owned data and inspect the filesystem before reclaiming space."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/docs/spec/metrics.md#shiftpvpoolnospace"
          - exp_labels: {job: shiftpv-custom, instance: "node-a:8080", namespace: shiftpv-system, node: worker-a, pool: both, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV Pool filesystem has no available space"
              description: "Pool both on node worker-a reports zero available bytes or inodes. New allocation is blocked and cleanup may need headroom for durable metadata. Preserve owned data and inspect the filesystem before reclaiming space."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/docs/spec/metrics.md#shiftpvpoolnospace"
      - eval_time: 8m
        alertname: ShiftPVPoolNoSpace
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'shiftpv_pool_filesystem_available_bytes{shiftpv="true",namespace="failed",node="worker-a",pool="pool-a"}'
        values: '0+0x10'
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",namespace="failed",node="worker-a",source="filesystem"}'
        values: '0+0x10'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="failed",node="worker-a",source="filesystem"}'
        values: '1+60x10'
      - series: 'shiftpv_pool_filesystem_available_inodes{shiftpv="true",namespace="stale",node="worker-b",pool="pool-b"}'
        values: '0+0x10'
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",namespace="stale",node="worker-b",source="filesystem"}'
        values: '1+0x10'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="stale",node="worker-b",source="filesystem"}'
        values: '1+0x10'
      - series: 'shiftpv_pool_filesystem_available_bytes{shiftpv="true",job="shiftpv-custom",instance="node-c:8080",namespace="missing",node="worker-c",pool="pool-c"}'
        values: '0+0x10'
      - series: 'shiftpv_metrics_snapshot_success{shiftpv="true",job="shiftpv-custom",instance="node-other:8080",namespace="missing",source="filesystem"}'
        values: '1+0x10'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",job="shiftpv-custom",instance="node-other:8080",namespace="missing",source="filesystem"}'
        values: '1+60x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ShiftPVPoolNoSpace
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{shiftpv="true",namespace="shiftpv-system",instance="controller"}'
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: ShiftPVObservationStale
        exp_alerts:
          - exp_labels: {instance: controller, namespace: shiftpv-system, severity: critical, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV observation is stale"
              description: "A ShiftPV observation source is failing, stale, or missing from the current scrape targets (source=(absent) instance=controller)."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvobservationstale"
          - exp_labels: {severity: critical, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV observation is stale"
              description: "A ShiftPV observation source is failing, stale, or missing from the current scrape targets (source=(absent))."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvobservationstale"

  - interval: 1m
    alert_rule_test:
      - eval_time: 6m
        alertname: ShiftPVObservationStale
        exp_alerts:
          - exp_labels: {severity: critical, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV observation is stale"
              description: "A ShiftPV observation source is failing, stale, or missing from the current scrape targets (source=(absent))."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvobservationstale"

  - interval: 1m
    input_series:
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="controller",instance="controller",source="metadata"}'
        values: '1 60 120 180 240 300 360 420 480 540 600'
      - series: 'up{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="controller",instance="controller"}'
        values: '1+0x10'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="node",node="worker-a",instance="worker-a",source="filesystem"}'
        values: '1 60 stale _ _ _ _ _ _ _ _'
      - series: 'up{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="node",node="worker-a",instance="worker-a"}'
        values: '1 1 stale _ _ _ _ _ _ _ _'
    alert_rule_test:
      - eval_time: 8m
        alertname: ShiftPVObservationStale
        exp_alerts:
          - exp_labels: {component: node, namespace: shiftpv-system, node: worker-a, release: shiftpv, severity: critical, shiftpv: "true", source: filesystem}
            exp_annotations:
              summary: "ShiftPV observation is stale"
              description: "A ShiftPV observation source is failing, stale, or missing from the current scrape targets (source=filesystem component=node node=worker-a)."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvobservationstale"

  - interval: 5m
    input_series:
      - series: 'shiftpv_persistent_volumes{shiftpv="true",namespace="shiftpv-system",phase="Released",pool="pool-a"}'
        values: '2+0x100'
      - series: 'shiftpv_persistent_volumes{shiftpv="true",namespace="shiftpv-system",phase="Bound",pool="pool-a"}'
        values: '3+0x100'
      - series: 'shiftpv_persistent_volumes{shiftpv="true",namespace="shiftpv-system",phase="Released",pool="pool-b"}'
        values: '0+0x100'
      - series: 'shiftpv_persistent_volumes_released_bytes{shiftpv="true",namespace="shiftpv-system",pool="pool-a"}'
        values: '26843545600+0x100'
    alert_rule_test:
      - eval_time: 5h55m
        alertname: ShiftPVReleasedVolumes
        exp_alerts: []
      - eval_time: 6h5m
        alertname: ShiftPVReleasedVolumes
        exp_alerts:
          - exp_labels: {namespace: shiftpv-system, phase: Released, pool: pool-a, severity: warning, shiftpv: "true"}
            exp_annotations:
              summary: "ShiftPV PersistentVolumes are waiting for a reclaim decision"
              description: "2 Released ShiftPV PersistentVolume(s) on pool pool-a kept their data after their claims were deleted and nothing reclaims them automatically; shiftpv_persistent_volumes_released_bytes{pool=\"pool-a\"} reports the held capacity."
              runbook_url: "https://github.com/project-jelly/ShiftPV/blob/main/charts/shiftpv/README.md#shiftpvreleasedvolumes"

  - interval: 1m
    input_series:
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="controller",pod="controller-old",instance="10.0.0.1:8080",source="metadata"}'
        values: '1 60 stale _ _ _ _ _ _ _ _'
      - series: 'shiftpv_metrics_snapshot_last_success_timestamp_seconds{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="controller",pod="controller-new",instance="10.0.0.2:8080",source="metadata"}'
        values: '_ _ 120 180 240 300 360 420 480 540 600'
      - series: 'up{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="controller",pod="controller-old",instance="10.0.0.1:8080"}'
        values: '1 1 stale _ _ _ _ _ _ _ _'
      - series: 'up{shiftpv="true",namespace="shiftpv-system",release="shiftpv",component="controller",pod="controller-new",instance="10.0.0.2:8080"}'
        values: '_ _ 1+0x8'
    alert_rule_test:
      - eval_time: 8m
        alertname: ShiftPVObservationStale
        exp_alerts: []
