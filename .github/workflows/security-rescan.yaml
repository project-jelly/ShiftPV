name: Released Image Security Report

on:
  schedule:
    # Daily at 09:43 Asia/Seoul (00:43 UTC); GitHub may delay scheduled runs.
    - cron: "43 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: released-image-security-report
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve latest released images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images: ${{ steps.images.outputs.images }}
      chart: ${{ steps.images.outputs.chart }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: ./.github/actions/install-k8s-tools
        with:
          kind: "false"
          kubectl: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve and validate the latest stable release
        id: images
        run: |
          lock="${RUNNER_TEMP}/released-images.env"
          ./test/e2e/kind/artifact/resolve-latest.sh > "${lock}"
          source test/e2e/kind/lib/artifact.sh
          load_artifact_lock "${lock}"
          images=$(jq -cn --arg controller "${CONTROLLER_IMAGE}" --arg node "${NODE_IMAGE}" \
            '[{component: "controller", ref: $controller}, {component: "node", ref: $node}]')
          echo "images=${images}" >> "${GITHUB_OUTPUT}"
          echo "chart=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Preserve the exact release identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: released-image-lock
          path: ${{ runner.temp }}/released-images.env
          if-no-files-found: error
          retention-days: 30

  scan:
    name: Report ${{ matrix.image.component }} (${{ matrix.arch }})
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.images) }}
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan released image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ matrix.image.ref }}
          platform: linux/${{ matrix.arch }}
          report-name: trivy-released-${{ matrix.image.component }}-${{ matrix.arch }}
