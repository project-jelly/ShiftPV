name: Release Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-images-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CI_RUN_ID: ${{ github.event.workflow_run.id }}
  CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  resolve:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    name: Resolve image releases
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      components: ${{ steps.release.outputs.components }}
      builds: ${{ steps.release.outputs.builds }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Download original main push identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-context
          path: release-context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify trusted successful CI and original push range
        run: build/ci/release-context.sh release-context/push.json

      - name: Resolve changed component versions
        id: release
        run: |
          set -euo pipefail
          components='[]'
          builds='[]'

          for component in controller node; do
            version_file="versions/${component}"
            version="$(tr -d '[:space:]' <"${version_file}")"
            should_release=$(build/ci/resolve-release-version.sh "$component" "$version" "$version_file")
            [[ "$should_release" == true ]] || continue
            tag="${component}/v${version}"

            version_arg="${component^^}_VERSION"
            component_json="$(jq -cn \
              --arg component "${component}" --arg version "${version}" --arg version_arg "${version_arg}" --arg tag "${tag}" \
              '{component: $component, version: $version, version_arg: $version_arg, tag: $tag}')"
            components="$(jq -cn --argjson items "${components}" --argjson item "${component_json}" '$items + [$item]')"

            for platform_spec in 'linux/amd64|ubuntu-latest|amd64' 'linux/arm64|ubuntu-24.04-arm|arm64'; do
              IFS='|' read -r platform runner arch <<<"${platform_spec}"
              build_json="$(jq -cn \
                --arg component "${component}" --arg version "${version}" --arg version_arg "${version_arg}" \
                --arg platform "${platform}" --arg runner "${runner}" --arg arch "${arch}" \
                '{component: $component, version: $version, version_arg: $version_arg, platform: $platform, runner: $runner, arch: $arch}')"
              builds="$(jq -cn --argjson items "${builds}" --argjson item "${build_json}" '$items + [$item]')"
            done
          done

          if [[ "$(jq 'length' <<<"${components}")" -eq 0 ]]; then
            echo "should_release=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          {
            echo "should_release=true"
            echo "components=${components}"
            echo "builds=${builds}"
          } >>"${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.component }} (${{ matrix.platform }})
    needs: resolve
    if: ${{ needs.resolve.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.builds) }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Resolve image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/shiftpv-${COMPONENT}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: build/package/Dockerfile
          target: ${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.version_arg }}=${{ matrix.version }}
          cache-from: type=gha,scope=shiftpv-${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=shiftpv-${{ matrix.component }}-${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Verify published platform image
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm "${IMAGE}@${DIGEST}" --help
          if [[ "${COMPONENT}" == controller ]]; then
            docker run --rm --entrypoint /bin/sh "${IMAGE}@${DIGEST}" \
              -ec "test -x /shiftpv-controller && test -x /shiftpv-uninstall-guard && test -x /shiftpv-volume-helper && test ! -e /shiftpv-node"
          else
            docker run --rm --entrypoint /bin/sh "${IMAGE}@${DIGEST}" \
              -ec "test -x /shiftpv-node && test ! -e /shiftpv-controller && test ! -e /shiftpv-uninstall-guard && test ! -e /shiftpv-volume-helper"
          fi

      - name: Scan candidate before promotion
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          platform: ${{ matrix.platform }}
          report-name: trivy-release-${{ matrix.component }}-${{ matrix.arch }}

      - name: Record verified source and CI in provenance
        run: python3 build/ci/release_provenance.py generate "$RUNNER_TEMP/provenance.json"

      - name: Attest candidate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/provenance.json

      - name: Verify signed provenance before promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-images.yaml" \
            --predicate-type https://slsa.dev/provenance/v1 \
            --deny-self-hosted-runners --format json > "$RUNNER_TEMP/verified-provenance.json"
          python3 build/ci/release_provenance.py verify "$RUNNER_TEMP/verified-provenance.json"

      - name: Preserve provenance verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-${{ matrix.component }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/provenance.json
            ${{ runner.temp }}/verified-provenance.json
          retention-days: 30
          if-no-files-found: warn

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish ${{ matrix.component }} v${{ matrix.version }}
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.components) }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Download component digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true

      - name: Resolve image name
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/shiftpv-${COMPONENT}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ matrix.version }}
        run: |
          images=()
          for digest in *; do
            images+=("${IMAGE}@sha256:${digest}")
          done
          if [[ "${#images[@]}" -ne 2 ]]; then
            echo "::error::expected two platform digests, found ${#images[@]}"
            exit 1
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${images[@]}"

      - name: Verify multi-platform manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ matrix.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" \
            | jq -r '.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"' \
            | sort -u > /tmp/actual-platforms
          printf '%s\n' linux/amd64 linux/arm64 > /tmp/expected-platforms
          diff -u /tmp/expected-platforms /tmp/actual-platforms

      - name: Create component release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ matrix.tag }}
          VERSION: ${{ matrix.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --target "${RELEASE_SHA}" \
              --title "shiftpv-${COMPONENT} v${VERSION}" \
              --generate-notes
          fi
