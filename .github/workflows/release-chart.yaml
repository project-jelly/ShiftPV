name: Release Helm Chart

on:
  push:
    branches: [main]
    paths:
      - charts/shiftpv/Chart.yaml

concurrency:
  group: release-chart-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  resolve:
    name: Resolve chart release
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Resolve chart release
        id: release
        run: |
          set -euo pipefail
          chart_file=charts/shiftpv/Chart.yaml
          version="$(awk '$1 == "version:" {print $2; exit}' "${chart_file}")"
          previous_version="$(git show "${{ github.event.before }}:${chart_file}" 2>/dev/null | awk '$1 == "version:" {print $2; exit}' || true)"

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${chart_file} version must use numeric major.minor.patch format"
            exit 1
          fi
          if [[ -n "${previous_version}" ]] && \
            ! build/ci/assert-version-increase.sh "${version}" "${previous_version}"; then
            echo "::error::${chart_file} version must increase"
            exit 1
          fi

          tag="chart/v${version}"
          if tagged_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}" 2>/dev/null)" && \
            [[ "${tagged_commit}" != "${RELEASE_SHA}" ]]; then
            echo "::error::tag ${tag} already points to a different commit"
            exit 1
          fi

          {
            echo "should_release=true"
            echo "version=${version}"
            echo "tag=${tag}"
          } >>"${GITHUB_OUTPUT}"

  publish:
    name: Publish shiftpv v${{ needs.resolve.outputs.version }}
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Install Helm
        uses: ./.github/actions/install-k8s-tools
        with:
          kind: "false"
          kubectl: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Wait for chart image manifests
        run: build/ci/wait-for-chart-images.sh

      - name: Package chart
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/chart"
          helm lint charts/shiftpv
          helm package charts/shiftpv --destination "${RUNNER_TEMP}/chart"
          test -f "${RUNNER_TEMP}/chart/shiftpv-${VERSION}.tgz"
          cd "${RUNNER_TEMP}/chart"
          sha256sum "shiftpv-${VERSION}.tgz" >"shiftpv-${VERSION}.tgz.sha256"

      - name: Check out chart repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: chart-repository

      - name: Update chart repository
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          package="shiftpv-${VERSION}.tgz"
          if [[ -f "chart-repository/${package}" ]]; then
            cmp "${RUNNER_TEMP}/chart/${package}" "chart-repository/${package}" || {
              echo "::error::published chart ${package} is immutable; bump charts/shiftpv/Chart.yaml" >&2
              exit 1
            }
          else
            cp "${RUNNER_TEMP}/chart/${package}" chart-repository/
          fi
          helm repo index chart-repository \
            --url https://project-jelly.github.io/ShiftPV
          touch chart-repository/.nojekyll
          cp docs/site/index.html chart-repository/index.html

      - name: Publish chart repository
        working-directory: chart-repository
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .nojekyll index.html index.yaml "shiftpv-${VERSION}.tgz"
          if ! git diff --cached --quiet; then
            git commit -m "Publish shiftpv chart v${VERSION}"
            git push origin HEAD:gh-pages
          fi

      - name: Create chart release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --target "${RELEASE_SHA}" \
              --title "shiftpv Helm chart v${VERSION}" \
              --notes "Install with: helm repo add shiftpv https://project-jelly.github.io/ShiftPV" \
              --latest=false \
              "${RUNNER_TEMP}/chart/shiftpv-${VERSION}.tgz" \
              "${RUNNER_TEMP}/chart/shiftpv-${VERSION}.tgz.sha256"
          fi

      - name: Verify public chart repository
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            helm repo remove shiftpv >/dev/null 2>&1 || true
            if helm repo add shiftpv https://project-jelly.github.io/ShiftPV >/dev/null 2>&1 && \
              helm repo update shiftpv >/dev/null 2>&1 && \
              helm show chart shiftpv/shiftpv --version "${VERSION}" >/dev/null 2>&1; then
              helm show chart shiftpv/shiftpv --version "${VERSION}"
              exit 0
            fi
            echo "waiting for GitHub Pages chart repository (${attempt}/30)"
            sleep 10
          done
          echo "::error::chart v${VERSION} was not available from GitHub Pages" >&2
          exit 1
