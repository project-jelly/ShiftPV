name: Public Artifact Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  workflow_run:
    workflows: [Release Helm Chart]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-artifact-smoke
  cancel-in-progress: true

jobs:
  kind-artifact-e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: kind-artifact-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-kubeconfig
      KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-kubeconfig
      ARTIFACT_LOCK_FILE: /tmp/shiftpv-${{ github.run_id }}-public-artifacts.env
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/install-k8s-tools
        with:
          report-versions: "true"

      - name: Resolve latest stable public artifacts
        run: ./test/e2e/kind/artifact/resolve-latest.sh > "${ARTIFACT_LOCK_FILE}"

      - name: Archive resolved artifact identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-artifact-lock
          path: ${{ env.ARTIFACT_LOCK_FILE }}
          if-no-files-found: error

      - name: Install and mount published artifacts
        env:
          KEEP_CLUSTER: "1"
        run: ./test/e2e/kind/artifact/run.sh

      - name: Export failure diagnostics
        if: failure()
        uses: ./.github/actions/kind-teardown
        with:
          cluster-name: shiftpv-artifact-e2e
          diagnostics-dir: .tmp/ci-artifact-diagnostics
          artifact-name: kind-artifact-e2e-diagnostics
          resource-kinds: nodes,pods,pvc,pv,storageclass,csinode
          extra-diagnostics: |
            cp "${ARTIFACT_LOCK_FILE}" .tmp/ci-artifact-diagnostics/artifact-lock.env

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name shiftpv-artifact-e2e || true
