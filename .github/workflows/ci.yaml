name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-context:
    name: Preserve main push identity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Record original push range
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p release-context
          jq -n --arg before "$BEFORE" --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" \
            '{before: $before, sha: $sha, repository: $repository}' > release-context/push.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-context
          path: release-context/push.json
          retention-days: 30
          if-no-files-found: error

  vulnerability-check:
    name: Vulnerability Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        run: |
          GOTOOLCHAIN=local go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Helm
        uses: ./.github/actions/install-k8s-tools
        with:
          kind: "false"
          kubectl: "false"

      - name: Run fast checks and coverage gate
        run: make verify

      - name: Validate dashboard queries against Prometheus
        run: bash test/helm/dashboard/run.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            .tmp/coverage.out
            .tmp/coverage.txt
          retention-days: 14

  image-build:
    name: image-${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            version_arg: CONTROLLER_VERSION
          - component: node
            version_arg: NODE_VERSION
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: |
          version=$(<"versions/${{ matrix.component }}")
          docker build \
            --target "${{ matrix.component }}" \
            --build-arg "${{ matrix.version_arg }}=${version}" \
            --tag "shiftpv-${{ matrix.component }}:ci" \
            --file build/package/Dockerfile \
            .

      - name: Verify entrypoint
        run: docker run --rm "shiftpv-${{ matrix.component }}:ci" --help

      - name: Verify image boundary
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "${COMPONENT}" == "controller" ]]; then
            docker run --rm --entrypoint /bin/sh "shiftpv-controller:ci" \
              -ec "test -x /shiftpv-controller && test -x /shiftpv-uninstall-guard && test -x /shiftpv-volume-helper && test ! -e /shiftpv-node"
          else
            docker run --rm --entrypoint /bin/sh "shiftpv-node:ci" \
              -ec "test -x /shiftpv-node && test ! -e /shiftpv-controller && test ! -e /shiftpv-uninstall-guard && test ! -e /shiftpv-volume-helper"
          fi

  candidate-image:
    name: candidate-${{ matrix.component }}
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/v04-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: controller
            version_arg: CONTROLLER_VERSION
          - component: node
            version_arg: NODE_VERSION
    steps:
      - name: Check out candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve candidate metadata
        id: candidate
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          short_sha="${GITHUB_SHA::8}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shiftpv-${COMPONENT}"
          base_version=$(<"versions/${COMPONENT}")
          {
            echo "image=${image}"
            echo "tag=candidate-${short_sha}"
            echo "version=${base_version}-candidate.${short_sha}"
          } >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: build/package/Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/amd64
          build-args: ${{ matrix.version_arg }}=${{ steps.candidate.outputs.version }}
          tags: ${{ steps.candidate.outputs.image }}:${{ steps.candidate.outputs.tag }}
          cache-from: type=gha,scope=shiftpv-candidate-${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=shiftpv-candidate-${{ matrix.component }}-amd64
          provenance: false
          push: true

      - name: Verify published candidate boundary
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          docker run --rm "${IMAGE}@${DIGEST}" --help
          if [[ "${COMPONENT}" == controller ]]; then
            docker run --rm --entrypoint /bin/sh "${IMAGE}@${DIGEST}" \
              -ec "test -x /shiftpv-controller && test -x /shiftpv-uninstall-guard && test -x /shiftpv-volume-helper && test ! -e /shiftpv-node"
          else
            docker run --rm --entrypoint /bin/sh "${IMAGE}@${DIGEST}" \
              -ec "test -x /shiftpv-node && test ! -e /shiftpv-controller && test ! -e /shiftpv-uninstall-guard && test ! -e /shiftpv-volume-helper"
          fi
          echo "candidate=${IMAGE}:${{ steps.candidate.outputs.tag }}@${DIGEST}" >>"${GITHUB_STEP_SUMMARY}"

  linux-mount:
    name: linux-mount
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run isolated Linux mount integration
        run: make linux-mount-integration

  # The scenario groups are independent of each other (see the grouping comment
  # in test/e2e/kind/run.sh), so they run as one cluster per job instead of one
  # ~17 minute serialized sweep. Matrix jobs cannot carry the branch-ruleset
  # check name, which is why the `kind-e2e` aggregator below reports their
  # result.
  kind-e2e-group:
    name: kind-e2e (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [g1, g2, g3]
    env:
      E2E_KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-${{ matrix.group }}-kubeconfig
      KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-${{ matrix.group }}-kubeconfig
      CLUSTER_NAME: shiftpv-e2e-${{ matrix.group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/install-k8s-tools
        with:
          report-versions: "true"

      - name: Run isolated kind E2E
        env:
          KEEP_CLUSTER: "1"
          KIND_E2E_GROUP: ${{ matrix.group }}
        run: ./test/e2e/kind/run.sh

      - name: Export failure diagnostics
        if: failure() || cancelled()
        uses: ./.github/actions/kind-teardown
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          diagnostics-dir: .tmp/ci-diagnostics
          artifact-name: kind-e2e-${{ matrix.group }}-diagnostics
          resource-kinds: nodes,pods,pvc,pv,storageclass,csinode

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER_NAME}" || true

  # Keeps the check name the branch ruleset requires while the work itself runs
  # in the group matrix above.
  kind-e2e:
    name: kind-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: kind-e2e-group
    if: always()
    steps:
      - name: Report group result
        env:
          RESULT: ${{ needs.kind-e2e-group.result }}
        run: |
          echo "kind-e2e groups: ${RESULT}"
          test "${RESULT}" = success

  # The scenario groups are independent of each other (see the grouping comment
  # in test/e2e/kind/mobility/run.sh), so they run as one cluster per job
  # instead of one ~20 minute serialized sweep. Matrix jobs cannot carry the
  # branch-ruleset check name, which is why the `kind-mobility-e2e` aggregator
  # below reports their result.
  kind-mobility-e2e-group:
    name: kind-mobility-e2e (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [g1, g2, g3]
    env:
      E2E_KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-${{ matrix.group }}-kubeconfig
      KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-${{ matrix.group }}-kubeconfig
      CLUSTER_NAME: shiftpv-mobility-e2e-${{ matrix.group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/install-k8s-tools
        with:
          report-versions: "true"

      - name: Run closed-loop mobility E2E
        env:
          KEEP_CLUSTER: "1"
          KIND_MOBILITY_GROUP: ${{ matrix.group }}
        run: ./test/e2e/kind/mobility/run.sh

      - name: Export failure diagnostics
        if: failure()
        uses: ./.github/actions/kind-teardown
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          diagnostics-dir: .tmp/ci-mobility-diagnostics
          artifact-name: kind-mobility-e2e-${{ matrix.group }}-diagnostics

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER_NAME}" || true

  # Keeps the check name the branch ruleset requires while the work itself runs
  # in the group matrix above.
  kind-mobility-e2e:
    name: kind-mobility-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: kind-mobility-e2e-group
    if: always()
    steps:
      - name: Report group result
        env:
          RESULT: ${{ needs.kind-mobility-e2e-group.result }}
        run: |
          echo "kind-mobility-e2e groups: ${RESULT}"
          test "${RESULT}" = success

  # The eight restart cases and the cleanup-Job retry tail are independent, so
  # they run as one shard per job instead of one ~36 minute serialized sweep.
  # Matrix jobs cannot carry the branch-ruleset check name, which is why the
  # `kind-mobility-node-restart-e2e` aggregator below reports their result.
  kind-mobility-node-restart-shard:
    name: kind-mobility-node-restart-e2e (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cases-1-2
            cases: source,destination
          - shard: cases-3-4
            cases: copying-source,copying-destination
          - shard: cases-5-6
            cases: promoting-destination,committed-destination
          - shard: cases-7-8
            cases: cleaning-source,cleaning-destination
          - shard: cleanup-job-retry
            cases: ""
    env:
      E2E_KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}-kubeconfig
      KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-${{ matrix.shard }}-kubeconfig
      CLUSTER_NAME: shiftpv-node-restart-${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/install-k8s-tools
        with:
          report-versions: "true"

      - name: Run node-container restart mobility E2E
        env:
          KEEP_CLUSTER: "1"
          MOBILITY_NODE_RESTARTS_ONLY: ${{ matrix.cases != '' && '1' || '0' }}
          MOBILITY_NODE_RESTART_CASE: ${{ matrix.cases }}
          CLEANUP_JOB_RETRY_ONLY: ${{ matrix.cases == '' && '1' || '0' }}
        run: ./test/e2e/kind/run.sh

      - name: Export failure diagnostics
        if: failure()
        uses: ./.github/actions/kind-teardown
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          diagnostics-dir: .tmp/ci-mobility-node-restart-diagnostics
          artifact-name: kind-mobility-node-restart-e2e-${{ matrix.shard }}-diagnostics

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER_NAME}" || true

  # Keeps the check name the branch ruleset requires while the work itself runs
  # in the shard matrix above.
  kind-mobility-node-restart-e2e:
    name: kind-mobility-node-restart-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: kind-mobility-node-restart-shard
    if: always()
    steps:
      - name: Report shard result
        env:
          SHARD_RESULT: ${{ needs.kind-mobility-node-restart-shard.result }}
        run: |
          echo "node-restart shards: ${SHARD_RESULT}"
          test "${SHARD_RESULT}" = success

  kind-upgrade-e2e:
    name: kind-upgrade-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-kubeconfig
      KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-kubeconfig
      CLUSTER_NAME: shiftpv-upgrade-e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/install-k8s-tools
        with:
          report-versions: "true"

      - name: Run published-to-candidate upgrade E2E
        env:
          KEEP_CLUSTER: "1"
        run: ./test/e2e/kind/upgrade/run.sh

      - name: Export failure diagnostics
        if: failure() || cancelled()
        uses: ./.github/actions/kind-teardown
        with:
          cluster-name: ${{ env.CLUSTER_NAME }}
          diagnostics-dir: .tmp/ci-upgrade-diagnostics
          artifact-name: kind-upgrade-e2e-diagnostics
          resource-kinds: nodes,pods,pvc,pv,storageclass,csinode

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name "${CLUSTER_NAME}" || true

  kind-argocd-e2e:
    name: kind-argocd-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      E2E_KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-kubeconfig
      KUBECONFIG: /tmp/shiftpv-${{ github.run_id }}-${{ github.job }}-kubeconfig
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/install-k8s-tools
        with:
          report-versions: "true"

      - name: Run isolated Argo CD uninstall E2E
        env:
          KEEP_CLUSTER: "1"
        run: ./test/e2e/kind/argocd/run.sh

      - name: Export failure diagnostics
        if: failure()
        uses: ./.github/actions/kind-teardown
        with:
          cluster-name: shiftpv-argocd-e2e
          diagnostics-dir: .tmp/ci-argocd-diagnostics
          artifact-name: kind-argocd-e2e-diagnostics
          extra-diagnostics: |
            kubectl -n argocd get applications -o yaml > .tmp/ci-argocd-diagnostics/applications.yaml 2>&1 || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name shiftpv-argocd-e2e || true
